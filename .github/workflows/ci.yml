name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          python -m pip install -r requirements-dev.txt

      - name: Lint Python code
        run: |
          ruff check .

      - name: Check Python formatting
        run: |
          ruff format --check .

      - name: Run tests with pytest
        run: |
          pytest -v

docker-build:
    name: Build production Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --tag bike-demand-api:ci .

      - name: Check runtime imports
        run: |
          docker run --rm bike-demand-api:ci \
            python -c "import pandas, sklearn, fastapi, joblib, pydantic; print('Runtime imports: OK')"

      - name: Check that development tools are excluded
        run: |
          docker run --rm bike-demand-api:ci sh -c '
            if python -m pip show pytest >/dev/null 2>&1; then
              echo "pytest must not be installed in the production image"
              exit 1
            else
              echo "pytest is not installed: OK"
            fi
          '
